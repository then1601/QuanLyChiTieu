<section class="page-container transactions-page">
  <header class="page-header">
    <div class="page-brand">
      <div class="brand-badge">
        <span class="material-icons">receipt_long</span>
      </div>
      <div class="page-copy">
        <span class="eyebrow">Quản lý</span>
        <h1>Giao dịch</h1>
      </div>
    </div>
    <a class="icon-button" routerLink="/add" aria-label="Thêm giao dịch">
      <span class="material-icons">add</span>
    </a>
  </header>

  <section class="panel">
    <form class="date-filter" (ngSubmit)="applyFilters()">
      <label>
        <span>Tuần</span>
        <input name="filterWeek" type="week" [(ngModel)]="filterWeek">
      </label>
      <button class="filter-submit" type="submit">Lọc</button>
    </form>

    <div class="filter-bar">
      <button [class.active]="filterCategoryId === 'all'" (click)="filterCategoryId = 'all'" type="button">Tất cả</button>
      <button
        *ngFor="let category of categories"
        [class.active]="filterCategoryId === category.id"
        (click)="filterCategoryId = category.id"
        type="button">
        <span class="material-icons">{{ category.icon }}</span>
        {{ category.name }}
      </button>
    </div>
  </section>

  <div class="transaction-list" *ngIf="transactions.length; else empty">
    <div class="transaction-row" *ngFor="let transaction of transactions; trackBy: trackTransaction">
      <app-transaction-card [transaction]="transaction" [category]="getCategory(transaction.categoryId)" />
      <a class="edit-button" [routerLink]="['/edit', transaction.id]" aria-label="Sửa giao dịch">
        <span class="material-icons">edit</span>
      </a>
      <button class="delete-button" (click)="deleteTransaction(transaction.id)" aria-label="Xóa giao dịch" type="button">
        <span class="material-icons">delete_outline</span>
      </button>
    </div>
  </div>

  <ng-template #empty>
    <div class="empty-state">
      <span class="material-icons">receipt_long</span>
      <h2>Chưa có giao dịch</h2>
      <p>Thêm giao dịch đầu tiên để theo dõi chi tiêu của bạn.</p>
      <a routerLink="/add">Thêm giao dịch</a>
    </div>
  </ng-template>
</section>
